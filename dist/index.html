<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: SVG para navegadores modernos, ICO/PNG de respaldo.
         ?v=2 obliga a recargarlo a quien tenga en caché el ícono anterior. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0087f6" />
    <!-- Aplica el tema guardado antes del primer pintado (evita el parpadeo) -->
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "dark" || saved === "light") theme = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        if (theme === "dark") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0b1220");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap"
